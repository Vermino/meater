[workspace]
members = ["core", "cli"]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.34.0", features = ["rt", "macros", "sync", "time"] }
tokio-util = "0.7.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Error handling
anyhow = "1.0.75"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# BLE support
btleplug = "0.11.3"

# Utilities
futures = "0.3.29"
uuid = "1.6.1"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

[profile.release]
codegen-units = 1
lto = true
