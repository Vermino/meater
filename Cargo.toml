[workspace]
members = ["meater-core", "meater-cli", "meater-display"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.75"
btleplug = "0.11.3"
tokio = { version = "1.34.0", features = ["rt", "rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7.13"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
uuid = "1.6.1"
futures = "0.3.29"

[profile.release]
codegen-units = 1
lto = true
