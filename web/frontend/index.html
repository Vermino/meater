<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meater Monitor - Real-time BBQ Temperature Tracking</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
    <script src="libs/react.production.min.js"></script>
    <script src="libs/react-dom.production.min.js"></script>
    <script src="libs/react-is.production.min.js"></script>
    <script src="libs/prop-types.min.js"></script>
    <script src="libs/babel.min.js"></script>
    <script src="libs/Recharts.js"></script>
    <script src="libs/tailwind.min.js"></script>
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-gray-900">
    <div id="root">
        <div style="color: white; padding: 20px; font-size: 18px;">
            <h1>Loading Meater Monitor...</h1>
            <p>If you see this, the HTML loaded successfully!</p>
            <p id="status">Initializing scripts...</p>
        </div>
    </div>
    <script>
        console.log('Page loaded, starting initialization...');
        document.getElementById('status').textContent = 'Scripts loaded, waiting for React...';
    </script>
    <script type="text/babel">
        console.log('Babel script running...');
        // Wait for Recharts to load
        window.addEventListener('load', function() {
            console.log('Window loaded event fired');
            document.getElementById('status').textContent = 'Loading dashboard...';
            // Give Recharts time to initialize
            setTimeout(() => {
                console.log('Loading dashboard.js');
                const script = document.createElement('script');
                script.type = 'text/babel';
                script.src = './dist/dashboard.js';
                script.onload = () => console.log('dashboard.js loaded successfully');
                script.onerror = (e) => {
                    console.error('Failed to load dashboard.js', e);
                    document.getElementById('status').textContent = 'Error loading dashboard.js';
                };
                document.body.appendChild(script);
            }, 100);
        });
    </script>
</body>
</html>
