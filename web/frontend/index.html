<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meater Monitor - Real-time BBQ Temperature Tracking</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
    <script>
        // Attempt to load a script from a list of URLs (local first, CDN fallback)
        function loadScript(urls, type = 'text/javascript') {
            return new Promise((resolve, reject) => {
                const tryNext = (index) => {
                    if (index >= urls.length) {
                        reject(new Error(`Failed to load script from URLs: ${urls.join(', ')}`));
                        return;
                    }

                    const script = document.createElement('script');
                    script.src = urls[index];
                    script.type = type;
                    script.onload = () => resolve();
                    script.onerror = () => {
                        console.warn(`Failed to load ${urls[index]}, trying next fallback if available...`);
                        tryNext(index + 1);
                    };
                    document.head.appendChild(script);
                };

                tryNext(0);
            });
        }
    </script>
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-gray-900">
    <div id="root">
        <div style="color: white; padding: 20px; font-size: 18px;">
            <h1>Loading Meater Monitor...</h1>
            <p>If you see this, the HTML loaded successfully!</p>
            <p id="status">Initializing scripts...</p>
        </div>
    </div>
    <script>
        console.log('Page loaded, starting initialization...');

        const statusEl = document.getElementById('status');
        statusEl.textContent = 'Loading frontend libraries...';

        const libraries = [
            { name: 'React', urls: ['./libs/react.production.min.js', 'https://unpkg.com/react@18/umd/react.production.min.js'] },
            { name: 'ReactDOM', urls: ['./libs/react-dom.production.min.js', 'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js'] },
            { name: 'ReactIs', urls: ['./libs/react-is.production.min.js', 'https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js'] },
            { name: 'PropTypes', urls: ['./libs/prop-types.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js'] },
            { name: 'Babel', urls: ['./libs/babel.min.js', 'https://unpkg.com/@babel/standalone/babel.min.js'] },
            { name: 'Recharts', urls: ['./libs/Recharts.js', 'https://unpkg.com/recharts@2.4.3/umd/Recharts.js'] },
            { name: 'Tailwind', urls: ['./libs/tailwind.min.js', 'https://cdn.tailwindcss.com'] },
        ];

        (async () => {
            try {
                for (const lib of libraries) {
                    statusEl.textContent = `Loading ${lib.name}...`;
                    await loadScript(lib.urls);
                    console.log(`${lib.name} loaded successfully`);
                }

                console.log('After prop-types load:', typeof window.PropTypes);
                console.log('PropTypes object:', window.PropTypes);

                statusEl.textContent = 'Loading dashboard...';

                // Fetch the dashboard source and compile it with Babel so
                // JSX renders correctly even when loaded dynamically.
                const dashboardSource = await fetch('./dist/dashboard.js').then((res) => {
                    if (!res.ok) {
                        throw new Error(`Failed to fetch dashboard.js: ${res.status} ${res.statusText}`);
                    }
                    return res.text();
                });

                if (!window.Babel) {
                    throw new Error('Babel is not available to compile the dashboard.');
                }

                const compiled = window.Babel.transform(dashboardSource, {
                    presets: ['env', 'react'],
                }).code;

                const dashboardScript = document.createElement('script');
                dashboardScript.type = 'text/javascript';
                dashboardScript.text = compiled;
                document.body.appendChild(dashboardScript);

                console.log('dashboard.js compiled and executed');

                statusEl.textContent = 'Dashboard loaded';
            } catch (err) {
                console.error('Initialization failed:', err);
                statusEl.textContent = 'Error initializing dashboard. Check console for details.';
            }
        })();
    </script>
</body>
</html>
