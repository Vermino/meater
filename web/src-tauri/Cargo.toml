[workspace]

[package]
name = "meater-tauri"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"

# Core dependencies
anyhow = "1.0.75"
futures = "0.3.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.34.0", features = ["rt", "macros", "sync", "time"] }
tokio-util = "0.7.13"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

# Local crates
meater-core = { path = "../../core" }
